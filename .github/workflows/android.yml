name: Android APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'lux-test.js', 'manifest.json', 'icons/**', 'android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'lux-test.js', 'manifest.json', 'icons/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Ubuntu runner ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.

      # Fingerprint of the Android part (the web app is not included). The app compares it with the
      # one in the newest release and only offers an APK update when it differs; web-only changes
      # reach installed apps as silent content updates (android/app/src/main/java/app/lux/Ota.java).
      - name: Fingerprint the Android part
        run: echo "NATIVE_HASH=$(git ls-files -s android | sha1sum | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../lux.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lux-apk
          path: lux.apk

      # Each build on main becomes a GitHub Release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/lux.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" lux.apk \
            --title "Lux 1.0.${{ github.run_number }}" \
            --notes "Android build of commit ${{ github.sha }}. Download lux.apk below and open it on your phone to install or update. native: ${{ env.NATIVE_HASH }}"
