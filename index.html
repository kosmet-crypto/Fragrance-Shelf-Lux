<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#161a18;--bg2:#1c211e;--surf:#222825;--surf2:#2a312d;--line:rgba(232,220,190,.13);--line2:rgba(232,220,190,.26);
--tx:#f5f0e4;--tx2:#cdc7b8;--tx3:#a39d8c;--gold:#dcbd7e;--gold2:#eed9a6;--goldink:#19130a;--glow:rgba(220,189,126,.14);
--danger:#dd7565;--ledge:rgba(202,169,107,.34);--scrim:rgba(6,7,6,.66);--glass:rgba(255,255,255,.04);
--gf:rgba(255,255,255,.07);--gs:rgba(255,255,255,.4);--shn:rgba(255,255,255,.18);
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
--bg:#e6e0d3;--bg2:#ddd6c7;--surf:#ece6d9;--surf2:#e3dccd;--line:rgba(44,36,20,.14);--line2:rgba(44,36,20,.27);
--tx:#14110c;--tx2:#3e382d;--tx3:#5f584a;--gold:#6f4f15;--gold2:#573c0c;--goldink:#fff8e8;--glow:rgba(111,79,21,.12);
--danger:#9c3324;--ledge:rgba(143,107,40,.4);--scrim:rgba(30,24,12,.45);--glass:rgba(0,0,0,.03);
--gf:rgba(0,0,0,.05);--gs:rgba(40,30,10,.45);--shn:rgba(255,255,255,.55)}}
:root[data-theme="light"]{
--bg:#e6e0d3;--bg2:#ddd6c7;--surf:#ece6d9;--surf2:#e3dccd;--line:rgba(44,36,20,.14);--line2:rgba(44,36,20,.27);
--tx:#14110c;--tx2:#3e382d;--tx3:#5f584a;--gold:#6f4f15;--gold2:#573c0c;--goldink:#fff8e8;--glow:rgba(111,79,21,.12);
--danger:#9c3324;--ledge:rgba(143,107,40,.4);--scrim:rgba(30,24,12,.45);--glass:rgba(0,0,0,.03);
--gf:rgba(0,0,0,.05);--gs:rgba(40,30,10,.45);--shn:rgba(255,255,255,.55)}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
html.lock{overflow:hidden}
body{font:15px/1.5 var(--sans);color:var(--tx);min-height:100%;-webkit-font-smoothing:antialiased;
background:radial-gradient(900px 520px at 78% -8%,var(--glow),transparent 65%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1{font:500 44px/1.02 var(--serif);letter-spacing:.005em}
h2{font:500 26px/1.1 var(--serif)}
h3{font:600 20px/1.15 var(--serif)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:38px 20px 26px;display:flex;flex-direction:column;gap:34px;border-right:1px solid var(--line)}
.mark{font:italic 500 50px/1 var(--serif);color:var(--gold2);letter-spacing:.01em}
.msub{color:var(--tx3);font-size:13px;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:4px}
.nb{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:14px;color:var(--tx2);text-align:left;transition:background .2s,color .2s}
.nb svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nb:hover{color:var(--tx);background:var(--glass)}
.nb.on{color:var(--gold2);background:var(--surf)}
.rail-foot{margin-top:auto;color:var(--tx3);font-size:12.5px;line-height:1.5}
#view{padding:44px 48px 90px;max-width:1120px;width:100%}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:30px}
.sub2{color:var(--tx2);margin-top:10px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--gold);color:var(--goldink);border-radius:999px;padding:11px 22px;font-weight:600;font-size:14px;transition:transform .2s,filter .2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold2)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line2)}
.btn.sm{padding:7px 15px;font-size:13px}
.note{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 18px;margin-bottom:26px;border:1px solid var(--line2);border-radius:16px;background:var(--surf);color:var(--tx2);font-size:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:26px}
.card+.card{margin-top:18px}
.muted{color:var(--tx3)}
/* shelves */
.shelf{margin-bottom:38px}
.shelf-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.shelf-h span{color:var(--tx3);font-size:13px}
.rack{--rowh:262px;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));grid-auto-rows:var(--rowh);min-height:var(--rowh);
background-image:linear-gradient(to bottom,transparent calc(100% - 2px),var(--ledge) calc(100% - 2px));background-size:100% var(--rowh);border-radius:6px;transition:background-color .2s}
.rack.over{background-color:var(--glow);box-shadow:0 0 0 1px var(--gold) inset}
.wish .rack{background-image:linear-gradient(to bottom,transparent calc(100% - 1px),var(--line2) calc(100% - 1px))}
.wish .bt{opacity:.72}
.empty{grid-column:1/-1;align-self:center;padding:0 10px;color:var(--tx3);max-width:420px}
.it{position:relative;display:flex;flex-direction:column;align-items:center;padding:8px 8px 14px;cursor:pointer;min-width:0;border-radius:14px;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.it img{-webkit-user-drag:none}
.it:hover .bt{transform:translateY(-7px)}
.it.dragging{opacity:.22}
.it.drop-l::before,.it.drop-r::after{content:"";position:absolute;top:16px;bottom:22px;width:2px;background:var(--gold);border-radius:2px}
.it.drop-l::before{left:0}.it.drop-r::after{right:0}
.bt{position:relative;width:88px;height:141px;margin-top:8px;transition:transform .32s cubic-bezier(.2,.7,.2,1);filter:drop-shadow(0 10px 12px rgba(0,0,0,.3))}
.bsv{width:100%;height:100%;display:block;overflow:visible}
.bsv .gl{fill:var(--gf);stroke:var(--gs)}
.bsv .sh{fill:var(--shn)}
.bt img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:8px;opacity:0}
.bt.has-img img{opacity:1}.bt.has-img .bsv{opacity:0}
.gauge{display:none;position:absolute;right:-8px;top:8px;bottom:8px;width:3px;background:var(--line2);border-radius:3px;overflow:hidden}
.gauge b{position:absolute;bottom:0;left:0;right:0;background:var(--gold)}
.has-img .gauge{display:block}
.nm{font:600 18px/1.12 var(--serif);margin-top:12px;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.br{font-size:12px;color:var(--tx3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{font-size:11.5px;color:var(--tx2);margin-top:3px;white-space:nowrap}
.ghost-el{position:fixed;left:0;top:0;z-index:300;pointer-events:none;width:90px;filter:drop-shadow(0 18px 24px rgba(0,0,0,.5))}
body.dragging-on{cursor:grabbing;-webkit-user-select:none;user-select:none}
/* forms */
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--tx);border-radius:12px;padding:11px 13px;font:inherit;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=range]{padding:0;height:26px;accent-color:var(--gold);background:none;border:0}
input[type=file]{display:none}
textarea{resize:vertical;min-height:84px}
label,.lb{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:6px}
.fg{margin-bottom:14px;position:relative;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 15px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2);font-size:13.5px;transition:all .2s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);color:var(--goldink);border-color:var(--gold);font-weight:600}
.stars{display:flex;gap:2px}
.stars button{font-size:24px;line-height:1;color:var(--line2);padding:2px 3px}
.stars button.on{color:var(--gold)}
.stars.dots button{font-size:15px}
.sugg{position:absolute;top:100%;left:0;right:0;z-index:20;margin-top:4px;background:var(--surf2);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.sugg:empty{display:none}
.sugg button{display:block;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.sugg button:last-child{border:0}
.sugg button:hover{background:var(--glass);color:var(--gold2)}
.sugg small{color:var(--tx3)}
/* modal */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal[hidden]{display:none}
.modal.dlg{z-index:200;align-items:center;padding:20px}
.panel{position:relative;width:min(640px,100%);max-height:92dvh;max-height:92vh;overflow:auto;background:var(--surf);border:1px solid var(--line2);border-radius:26px 26px 0 0;padding:28px 26px calc(24px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.dlg .panel{width:min(420px,100%);border-radius:24px;padding:26px}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.x{position:absolute;right:16px;top:14px;font-size:26px;color:var(--tx3);width:36px;height:36px;border-radius:50%}
.x:hover{color:var(--tx);background:var(--glass)}
.s-top{display:flex;gap:22px;align-items:flex-start;margin-bottom:20px;padding-right:26px}
.s-bt{flex:none;width:96px}
.s-bt .bt{width:96px;height:154px;margin:0}
.s-id{flex:1;min-width:0}
.s-id input{font:600 22px var(--serif);}
.s-stats{display:flex;gap:16px;flex-wrap:wrap;color:var(--tx2);font-size:13px;margin-top:4px}
.s-stats b{color:var(--tx);font-weight:600}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.foot .sp{margin-right:auto}
.stepper{display:flex;align-items:center;justify-content:center;gap:26px;margin:18px 0 22px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line2);font-size:24px;color:var(--gold2)}
.stepper button:hover{border-color:var(--gold)}
.stepper b{font:500 54px/1 var(--serif);min-width:64px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .3s;z-index:400;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* insights */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:22px;background:var(--surf);margin-bottom:18px}
.kpi{padding:22px 22px;border-left:1px solid var(--line)}
.kpi:first-child{border:0}
.kpi b{display:block;font:500 34px/1.05 var(--serif);color:var(--gold2)}
.kpi span{font-size:12.5px;color:var(--tx3)}
.ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:22px}
.ctl .fg{margin:0;min-width:170px}
.donut-wrap{display:grid;grid-template-columns:270px 1fr;gap:34px;align-items:center}
.dn{position:relative;width:270px;height:270px}
.dn svg{width:100%;height:100%;display:block}
.seg{transition:stroke-dasharray .95s cubic-bezier(.2,.7,.2,1),opacity .2s;cursor:pointer}
.dn.hl .seg{opacity:.25}.dn.hl .seg.on{opacity:1}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px;pointer-events:none}
.dc b{font:500 34px/1.05 var(--serif)}
.dc span{font-size:12.5px;color:var(--tx3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg{display:flex;flex-direction:column}
.lg-row{display:grid;grid-template-columns:14px 1fr auto auto;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;border-radius:8px}
.lg-row:hover,.lg-row.on{background:var(--glass)}
.lg-row i{width:11px;height:11px;border-radius:4px}
.lg-row .v{color:var(--tx2);font-variant-numeric:tabular-nums}
.lg-row .p{color:var(--tx3);width:46px;text-align:right;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:5px;height:130px;margin-top:6px}
.bar{flex:1;max-width:46px;background:var(--gold);border-radius:4px 4px 1px 1px;min-height:2px;opacity:.85;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.bar.z{background:var(--line2);opacity:1}
@keyframes grow{from{transform:scaleY(0)}}
.axis{display:flex;justify-content:space-between;color:var(--tx3);font-size:12px;margin-top:8px}
.row{display:flex;gap:16px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px}
.row:hover{background:var(--glass)}
.row .th{flex:none;width:34px;height:54px}
.row .th .bt{width:34px;height:54px;margin:0;filter:none}
.row .mid{flex:1;min-width:0}
.row .t1{font:600 18px/1.15 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12.5px;color:var(--tx3)}
.meter{height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.meter b{display:block;height:100%;background:var(--gold);border-radius:4px}
.row .rt{flex:none;text-align:right;font-size:13px;color:var(--tx2);min-width:96px}
/* journal */
.today{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.today .bt{width:90px;height:144px;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dw{font-size:12px;color:var(--tx3);text-align:center;padding-bottom:4px}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--tx2);background:var(--glass)}
.cal .d.t{outline:1px solid var(--gold)}
.cal .d.e{background:transparent}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ch button{font-size:22px;color:var(--tx2);width:38px;height:38px;border-radius:50%}
.ch button:hover{background:var(--glass);color:var(--gold2)}
.day-h{font:500 18px var(--serif);color:var(--gold2);margin:22px 0 4px}
.wr{display:flex;align-items:center;gap:14px;padding:10px 4px;border-bottom:1px solid var(--line)}
.wr .th{width:26px;height:42px;flex:none}
.wr .th .bt{width:26px;height:42px;margin:0;filter:none}
.wr .mid{flex:1;min-width:0;font-size:14px}
.wr .mid small{display:block;color:var(--tx3)}
.wr button{color:var(--tx3);font-size:20px;width:34px;height:34px;border-radius:50%}
.wr button:hover{color:var(--danger)}
.g3{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.g3 .card+.card{margin-top:0}
/* library */
.lrow{display:flex;gap:16px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line)}
.lrow .th{flex:none;width:34px;height:54px}
.lrow .th .bt{width:34px;height:54px;margin:0;filter:none}
.lrow .mid{flex:1;min-width:0}
.lrow .t1{font:600 18px/1.15 var(--serif)}
.lrow .t2{font-size:12.5px;color:var(--tx3)}
.lrow .t3{font-size:12px;color:var(--tx3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ac{display:flex;gap:8px;flex:none}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);font-size:17px;color:var(--tx2)}
.ic:hover{border-color:var(--gold);color:var(--gold2)}
.ic.on{color:var(--gold);border-color:var(--gold)}
.filters{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr;gap:12px;margin-bottom:8px}
.filters .fg{margin:0}
.sg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px}
.sg button{padding:7px 16px;border-radius:999px;font-size:13.5px;color:var(--tx2)}
.sg button.on{background:var(--gold);color:var(--goldink);font-weight:600}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border:0}
.set-row small{display:block;color:var(--tx3)}
.shrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.shrow input{flex:1}
.shrow button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);color:var(--tx2)}
.shrow button:hover{border-color:var(--gold);color:var(--gold2)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi{border-left:0;border-top:1px solid var(--line)}.kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(even){border-left:1px solid var(--line)}.donut-wrap{grid-template-columns:1fr}.dn{margin:0 auto}.g3{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
.app{display:block}
.rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:0;border-right:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);z-index:60}
.rail .brand,.rail-foot{display:none}
.nav{flex-direction:row;width:100%;justify-content:space-around}
.nb{flex-direction:column;gap:3px;padding:7px 10px;font-size:11px;border-radius:12px;align-items:center}
#view{padding:26px 18px 120px}
h1{font-size:38px}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.rack{--rowh:246px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.bt{width:82px;height:131px}
.nm{font-size:16.5px}
.cols,.g2{grid-template-columns:1fr}
.panel{padding:26px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.lrow .ac .ic{width:36px;height:36px}
}
@media (min-width:700px){.modal:not(.dlg){align-items:center;padding:24px}.modal:not(.dlg) .panel{border-radius:26px}}
/* the close button stays in reach while a long panel scrolls; the scrim above stays tappable */
.panel{max-height:88vh;max-height:88dvh}
.panel>.x{position:sticky;top:0;float:right;margin:-14px -10px 0 10px;z-index:5;background:var(--surf2);border:1px solid var(--line2);box-shadow:0 4px 14px rgba(0,0,0,.25);display:grid;place-items:center}
/* daily pick, wishlist, share */
.wr .wtag{flex:none;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line2);border-radius:99px;padding:3px 9px}

<script>

/* ================= utils ================= */

/* ================= state ================= */
const defaults=()=>({v:2,demo:false,
 shelves:[{id:'s1',name:'Daily'},{id:'s2',name:'Niche & special'},{id:'s3',name:'Summer & fresh'}],
 perfumes:[],wears:[],mine:[],
 settings:{spm:0,spmV:2,theme:'dark',cur:'€',remind:true,lastBackup:0,snooze:0,ins:{m:'ml',g:'perfume',p:'30'},rem:{am:false,amT:'08:30',pm:false,pmT:'20:30'},occ:'day'}});
function migrate(o){const d=defaults();const s=Object.assign(d,o||{});
 s.settings=Object.assign(defaults().settings,(o&&o.settings)||{});
 s.settings.ins=Object.assign(defaults().settings.ins,(o&&o.settings&&o.settings.ins)||{});
 s.settings.rem=Object.assign(defaults().settings.rem,(o&&o.settings&&o.settings.rem)||{});
 /* v2 of sprays per ml: 0 means by bottle size; the old default of 11 becomes that */
 if(s.settings.spmV!==2){if(+s.settings.spm===11)s.settings.spm=0;s.settings.spmV=2}
 s.perfumes.forEach(p=>{if(!p.cal)p.cal={ml:+p.ml||0,sprays:p.sprays||0}});
 ['shelves','perfumes','wears','mine'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=d[k]});

function autoSnap(){try{const a=JSON.parse(localStorage.getItem('lux.snaps')||'[]');
 if(!S.perfumes.length)return;if(a.length&&Date.now()-a[0].t<20*36e5)return;
 a.unshift({t:Date.now(),why:'Automatic',n:S.perfumes.length,data:JSON.stringify(S)});
 localStorage.setItem('lux.snaps',JSON.stringify(a.slice(0,6)))}catch(e){}}

 a.unshift({t:Date.now(),why,n:S.perfumes.length,data:JSON.stringify(S)});
 localStorage.setItem('lux.snaps',JSON.stringify(a.slice(0,6)))}catch(e){}}

/* ================= IndexedDB (photos + imported library) ================= */
const idb={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('lux',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('kv')};
  r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
 op(mode,fn){return new Promise(res=>{if(!this.db)return res(undefined);try{const tx=this.db.transaction('kv',mode);const q=fn(tx.objectStore('kv'));
  if(q){q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}tx.oncomplete=()=>res(q?q.result:true);tx.onerror=()=>res(undefined)}catch(e){res(undefined)}})},
 get(k){return this.op('readonly',s=>s.get(k))},
 set(k,v){return this.op('readwrite',s=>s.put(v,k))},
 del(k){return this.op('readwrite',s=>s.delete(k))}};
let PHOTOS={},IMPORTED=[];
async function loadPhotos(){PHOTOS={};for(const p of S.perfumes){const d=await idb.get('photo:'+p.id);if(d)PHOTOS[p.id]=d}}
async function loadImported(){const a=await idb.get('imported');IMPORTED=Array.isArray(a)?a:[]}
function compressImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;
 im.onload=()=>{const M=420,k=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(file)})}

/* ================= bottle renderer ================= */
const FAMS=[['oud','#8c3a45'],['leather','#8a5a36'],['tobacco','#94643a'],['gourmand','#c0763f'],['amber','#cf9430'],['orient','#b06a2c'],['spic','#c9583a'],['wood','#a9773f'],['citr','#dcc04a'],['fresh','#5fb3ba'],['aqua','#4d8ecb'],['marine','#4d8ecb'],['flor','#d98ca4'],['powd','#bfaccd'],['green','#76a55f'],['aromat','#86a061'],['fougere','#6a8b76'],['chypre','#8f8154'],['fruit','#dc7f56'],['musk','#cdbca5']];
const famColor=f=>{const s=norm(f);for(const [k,c] of FAMS)if(s.includes(k))return c;return '#b8a06a'};
const SHAPES=[
 {b:{x:20,y:60,w:60,h:88,r:7},n:{x:40,y:48,w:20,h:12},c:{x:35,y:16,w:30,h:32,r:3}},
 {b:{x:30,y:54,w:40,h:94,r:5},n:{x:44,y:44,w:12,h:10},c:{x:40,y:14,w:20,h:30,r:9}},
 {b:{x:15,y:72,w:70,h:76,r:10},n:{x:38,y:62,w:24,h:10},c:{x:31,y:30,w:38,h:32,r:4}},
 {b:{x:26,y:48,w:48,h:100,r:12},n:{x:41,y:40,w:18,h:8},c:{x:37,y:14,w:26,h:26,r:13}}];
function initials(b){const w=String(b||'?').replace(/[^\p{L}\s]/gu,'').split(/\s+/).filter(Boolean);
 if(w.length>1)return (w[0][0]+w[1][0]).toUpperCase();const x=w[0]||'?';return x[0].toUpperCase()+(x[1]||'').toLowerCase()}
function bottle(p,level){
 const s=SHAPES[hash((p.brand||'')+(p.name||''))%4],b=s.b,col=famColor(p.fam);
 const lv=clamp(level==null?1:level,0.04,1),lh=(b.h-6)*lv,yb=b.y+b.h-3,ly=yb-lh,lx=b.x+3,lw=b.w-6,r=Math.min(b.r-1,lh);
 const liq=`M${lx} ${ly}H${lx+lw}V${yb-r}Q${lx+lw} ${yb} ${lx+lw-r} ${yb}H${lx+r}Q${lx} ${yb} ${lx} ${yb-r}Z`;
 const ty=b.y+b.h*.42;
 return `<svg viewBox="0 0 100 160" class="bsv" aria-hidden="true"><ellipse cx="50" cy="152" rx="${b.w*.55}" ry="3.2" fill="#000" opacity=".3"/>`+
 `<rect class="gl" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="${b.r}" stroke-width="1.2"/>`+
 `<path d="${liq}" fill="${col}" opacity=".9"/><path d="${liq}" fill="url(#g-shade)"/>`+
 (lv<1?`<rect x="${lx}" y="${ly}" width="${lw}" height="1.3" fill="#fff" opacity=".42"/>`:'')+
 `<rect class="sh" x="${b.x+7}" y="${b.y+7}" width="4" height="${b.h-14}" rx="2"/>`+
 `<rect x="${b.x+b.w*.2}" y="${ty}" width="${b.w*.6}" height="22" rx="2" fill="rgba(12,12,10,.58)" stroke="rgba(202,169,107,.55)" stroke-width=".6"/>`+
 `<text x="50" y="${ty+15}" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="13" font-weight="600" fill="#e6cf98">${esc(initials(p.brand))}</text>`+
 `<rect x="${s.n.x}" y="${s.n.y}" width="${s.n.w}" height="${s.n.h}" fill="#8c7a52"/>`+
 `<rect x="${s.c.x}" y="${s.c.y}" width="${s.c.w}" height="${s.c.h}" rx="${s.c.r}" fill="url(#g-cap)" stroke="rgba(0,0,0,.35)" stroke-width=".6"/></svg>`}

 return `<div class="bt">${bottle(p,level)}${img?`<img src="${esc(img)}" alt=""><i class="gauge"><b style="height:${Math.round(clamp(level,0,1)*100)}%"></b></i>`:''}</div>`}
document.addEventListener('load',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.parentNode&&t.parentNode.classList.contains('bt'))t.parentNode.classList.add('has-img')},true);
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.parentNode&&t.parentNode.classList&&t.parentNode.classList.contains('bt'))t.remove()},true);

/* ================= library ================= */
const FL={AR:'Aromatic',WO:'Woody',AM:'Amber',FR:'Fresh',CI:'Citrus',FL:'Floral',GO:'Gourmand',LE:'Leather',OU:'Oud',FO:'Fougère',AQ:'Aquatic',SP:'Spicy',PO:'Powdery',GR:'Green',CH:'Chypre',TB:'Tobacco',FT:'Fruity',MS:'Musk',OR:'Oriental'};
const CL={T:'EDT',P:'EDP',X:'Parfum',C:'Cologne',E:'Elixir'};
const mk=(n,b,f,c,y,s,t,src)=>({n,b,f:f||'',c:c||'',y:+y||0,s:+s||0,t:t||'',src,k:norm(b+' '+n),bk:norm(b)});
let BUILTIN=[],LIB=[];
function parseRaw(){RAW.trim().split('\n').forEach(line=>{line=line.trim();if(!line)return;const i=line.indexOf('>');const h=line.slice(0,i),rest=line.slice(i+1);
 const [brand,ds]=h.split('@');const dsz=+ds||100;
 rest.split(';').forEach(x=>{const a=x.split('|');if(!a[0]||!a[0].trim())return;BUILTIN.push(mk(a[0].trim(),brand.trim(),FL[a[1]],CL[a[2]]||'EDP',a[3],a[4]||dsz,'','b'))})})}
function buildLib(){LIB=BUILTIN.concat(IMPORTED.map(a=>mk(a[0],a[1],a[2],a[3],a[4],a[5],a[6],'i')),S.mine.map(e=>mk(e.n,e.b,e.f,e.c,e.y,e.s,e.t,'m')))}
function libFind(q,f){f=f||{};const words=norm(q).split(/\s+/).filter(Boolean),bq=norm(f.b),out=[];
 for(let i=0;i<LIB.length;i++){const e=LIB[i];if(bq&&!e.bk.includes(bq))continue;if(f.f&&e.f!==f.f)continue;if(f.c&&e.c!==f.c)continue;
  if(words.length&&!words.every(w=>e.k.includes(w)))continue;out.push(i)}
 if(words.length){const q0=words.join(' ');const sc=i=>{const e=LIB[i];return (norm(e.n).startsWith(q0)?3:0)+(e.bk.startsWith(q0)?2:0)+(e.k.includes(q0)?1:0)};out.sort((a,b)=>sc(b)-sc(a))}
 return out}

 ['Citrus',/bergamot|lemon|grapefruit|orange|mandarin|lime|yuzu|neroli/],['Floral',/rose|jasmine|iris|tuberose|peony|lily|violet|magnolia|orange blossom|ylang/],
 ['Woody',/cedar|sandal|vetiver|patchouli|oak|cypress|guaiac|wood/],['Amber',/amber|labdanum|benzoin|resin|incense|myrrh|frankincense|olibanum/],['Aromatic',/lavender|sage|rosemary|mint|basil|thyme|artemisia/],
 ['Spicy',/pepper|cinnamon|cardamom|saffron|clove|ginger|nutmeg/],['Aquatic',/marine|sea |aquatic|ozone|salt/],['Musk',/musk|ambrette/],['Fruity',/apple|peach|pear|berry|cherry|plum|pineapple|fig|blackcurrant|lychee|mango/]];

/* ================= demo seed ================= */

function seed(){const s=defaults(),now=Date.now(),rnd=mulberry(7);
 const D=[['Sauvage Elixir','Dior','Spicy','Elixir','s1',60,41,155,4,9,4,['Autumn','Winter'],'Dense and syrupy. One or two sprays is plenty.'],
 ['Bleu de Chanel','Chanel','Woody','Parfum','s1',100,78,150,4,8,3,['Spring','Autumn'],'Easy, polished, works everywhere.'],
 ['Terre d\u2019Herm\u00e8s','Herm\u00e8s','Woody','Parfum','s1',75,52,105,5,9,3,['Autumn','Spring'],''],
 ['Layton','Parfums de Marly','Spicy','EDP','s2',125,96,230,5,10,4,['Autumn','Winter'],'Apple, vanilla, a warm wood base.'],
 ['Aventus','Creed','Fruity','EDP','s2',100,62,360,4,8,4,['Spring','Summer'],''],
 ['Tuscan Leather','Tom Ford','Leather','EDP','s2',50,33,190,4,7,3,['Winter'],'Save it for cold evenings.'],
 ['Baccarat Rouge 540','Maison Francis Kurkdjian','Amber','EDP','s2',70,58,240,5,12,5,['Autumn','Winter'],''],
 ['Acqua di Gi\u00f2 Profondo','Armani','Aquatic','EDP','s3',100,70,95,3,6,3,['Summer'],''],

function activityHtml(per){const AW=allWears(),now=sod(Date.now());let n,unit;if(per==='1'){n=24;unit='h'}else if(per==='7'){n=7;unit='d'}else if(per==='30'){n=30;unit='d'}else if(per==='90'){n=13;unit='w'}else{n=12;unit='m'}

 <button class="btn ghost sm" data-act="shAdd" style="margin-top:6px">Add shelf</button></div>
 ${remHtml()}
 <div class="card"><h3>Backup and restore</h3><p class="muted" style="margin:6px 0 16px">Last backup: ${lb}. A backup holds your collection, journal, settings, photos and own library entries.</p>
 <div class="acts"><button class="btn" data-act="bkNow">Download backup</button><button class="btn ghost" data-act="bkCopy">Copy as text</button><button class="btn ghost" data-act="bkFile">Restore from file</button></div>
 <input type="file" id="bkFile" accept=".json,application/json,text/plain">
 <div class="fg" style="margin-top:18px"><label for="bk-text">Or paste a backup here</label><textarea id="bk-text" placeholder="Paste backup text"></textarea></div>
 <button class="btn ghost sm" data-act="bkText">Restore from text</button>
 <div class="set-row" style="margin-top:16px"><div>Remind me to back up<small>A gentle note on the Collection page every two weeks</small></div><button class="chip${s.remind?' on':''}" data-act="remind">${s.remind?'On':'Off'}</button></div>
 <h3 style="margin:22px 0 4px">Automatic snapshots</h3><p class="muted" style="margin-bottom:8px;font-size:13.5px">Saved in this browser about once a day, and before every restore.</p>
 ${snaps.length?snaps.map((x,i)=>`<div class="set-row"><div>${new Date(x.t).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}<small>${esc(x.why)} \u00b7 ${x.n} fragrances</small></div><button class="btn ghost sm" data-act="snapRestore" data-i="${i}">Restore</button></div>`).join(''):'<p class="muted">None yet.</p>'}</div>
 <div class="card"><h3>Updates</h3><div class="set-row"><div>${window.LuxAndroid&&LuxAndroid.getVersion?'Lux '+esc(LuxAndroid.getVersion())+' for Android':'Lux web app'}<small>Updates keep your collection and settings</small></div><button class="btn ghost sm" data-act="checkUpdate">Check for updates</button></div></div>
 <div class="card"><h3>Library and data</h3>
 <div class="set-row"><div>Imported library<small>${fmt(IMPORTED.length)} entries. Your own entries are kept.</small></div><button class="btn ghost sm" data-act="clrImp">Clear imported</button></div>
 <div class="set-row"><div>Erase everything<small>Removes the collection, journal, photos and own entries</small></div><button class="btn danger sm" data-act="reset">Erase all</button></div></div>`}

function render(){const v=$('#view');
 v.innerHTML=({shelf:vShelf,journal:vJournal,ins:vIns,lib:vLib,set:vSet}[ui.tab]||vShelf)();
 $$('#nav .nb').forEach(b=>b.classList.toggle('on',b.dataset.t===ui.tab));
 const own=owned();$('#railFoot').innerHTML=`${own.length} in the cabinet<br>${fmt(LIB.length)} in the library`;
 if(ui.tab==='ins')animateDonut();
 if(ui.tab==='lib'){const bl=$('#brand-list');if(bl&&!bl.children.length){bl.innerHTML=[...new Set(LIB.map(e=>e.b))].sort().slice(0,4000).map(b=>`<option value="${esc(b)}">`).join('')}}}

function applyTheme(){const t=S.settings.theme,r=document.documentElement,and=window.LuxAndroid&&LuxAndroid.isNight;
 const eff=t!=='auto'?t:and?(LuxAndroid.isNight()?'dark':'light'):matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
 if(t==='auto'&&!and)r.removeAttribute('data-theme');else r.setAttribute('data-theme',eff);
 const bg=getComputedStyle(r).getPropertyValue('--bg').trim(),m=document.querySelector('meta[name="theme-color"]');if(m&&bg)m.setAttribute('content',bg);

function startImport(text,fname){let rows;

 const pv=rows.slice(0,3).map(r=>`${esc(map.name>=0?r[map.name]:'?')}${map.brand>=0?' <span class="muted">\u00b7 '+esc(r[map.brand])+'</span>':''}`).join('<br>');

window.luxBackupSaved=backupSaved; /* called by the Android app once the file is written */
async function backupNow(){const txt=await buildBackup(),name='lux-backup-'+dkey(Date.now())+'.json';let done=false;
 if(window.LuxAndroid){LuxAndroid.saveFile(name,txt);return} /* WebView cannot download blob: URLs */
 try{const c=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(c){await c.save({filename:name,data:txt});done=true}}catch(e){if(e&&e.code==='declined')return}
 if(!done){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();done=true}catch(e){}}

 if(!o||o.app!=='lux-perfume-cabinet'||!o.state||!Array.isArray(o.state.perfumes)){toast('That is not a Lux backup');return}
 const ok=await askConfirm('Restore this backup?',`It holds ${o.state.perfumes.length} fragrances and ${(o.state.wears||[]).length} wears. Your current data is snapshotted first, then replaced.`,'Restore');if(!ok)return;
 snapNow('Before restore');for(const p of S.perfumes)await idb.del('photo:'+p.id);
 S=migrate(o.state);PHOTOS={};for(const id in (o.photos||{})){PHOTOS[id]=o.photos[id];await idb.set('photo:'+id,o.photos[id])}

const dnd={id:null,el:null,sx:0,sy:0,lx:0,ly:0,on:false,timer:null,pt:'',ghost:null,tgt:null,ended:0};
function clearMarks(){$$('.rack.over').forEach(r=>r.classList.remove('over'));$$('.it.drop-l,.it.drop-r').forEach(i=>i.classList.remove('drop-l','drop-r'))}
function dndStart(x,y){if(!dnd.el)return;dnd.on=true;dnd.el.classList.add('dragging');const g=document.createElement('div');g.className='ghost-el';const b=$('.bt',dnd.el);g.innerHTML=b?b.outerHTML:'';document.body.appendChild(g);dnd.ghost=g;document.body.classList.add('dragging-on');

function dndMove(x,y){dnd.ghost.style.transform=`translate(${x-45}px,${y-72}px) scale(1.06)`;clearMarks();dnd.tgt=null;
 const el=document.elementFromPoint(x,y);
 if(el){const it=el.closest('.it'),rk=el.closest('.rack');
  if(it&&it.dataset.id===dnd.id){dnd.tgt=null}
  else if(it){const r=it.getBoundingClientRect(),after=x>r.left+r.width/2;it.classList.add(after?'drop-r':'drop-l');dnd.tgt={id:it.dataset.id,after}}
  else if(rk){rk.classList.add('over');dnd.tgt={shelf:rk.dataset.shelf}}}
 if(y<90)scrollBy(0,-16);else if(y>innerHeight-90)scrollBy(0,16)}
function dndEnd(commit){clearTimeout(dnd.timer);
 if(dnd.on){const t=dnd.tgt,id=dnd.id;if(dnd.ghost)dnd.ghost.remove();if(dnd.el)dnd.el.classList.remove('dragging');clearMarks();document.body.classList.remove('dragging-on');dnd.ended=Date.now();dnd.on=false;dnd.ghost=null;if(commit&&t)movePerfume(id,t)}
 dnd.id=null;dnd.el=null}
function movePerfume(id,t){const i=S.perfumes.findIndex(p=>p.id===id);if(i<0)return;const [p]=S.perfumes.splice(i,1);
 if(t.id){const j=S.perfumes.findIndex(q=>q.id===t.id);if(j<0){S.perfumes.push(p)}else{p.shelf=S.perfumes[j].shelf;S.perfumes.splice(j+(t.after?1:0),0,p)}}

/* ================= bottle maths: sprays per ml, value, pace ================= */
/* Sprays per ml, most specific first: the number entered for this bottle, what Lux learned from
   corrections of the remaining amount, the default from Settings, or a default by bottle size
   (atomizers on big bottles give more per spray; see README). */
const sizeSpm=p=>p.type==='Decant'||(+p.maxMl||100)<=30?15:(+p.maxMl||100)<=75?12:10;
const rateOf=p=>+p.spm>0?+p.spm:+p.spmAuto>0?+p.spmAuto:+S.settings.spm>0?+S.settings.spm:sizeSpm(p);
const rateSrc=p=>+p.spm>0?'your number':+p.spmAuto>0?'learned from your corrections':+S.settings.spm>0?'your default':'by bottle size';
/* Correcting the remaining ml by hand tells Lux how much this atomizer really sprays. */
function learnRate(p,old){const c=old.cal;p.cal={ml:p.ml,sprays:p.sprays||0};if(!c)return;
 const n=(p.sprays||0)-c.sprays,used=c.ml-p.ml;if(n>=15&&used>=1)p.spmAuto=Math.round(clamp(n/used,4,30)*10)/10}
const hasPrice=p=>+p.price>0&&+p.maxMl>0;
const perMl=p=>hasPrice(p)?+p.price/+p.maxMl:0;
const valueLeft=p=>hasPrice(p)?+p.price*clamp(p.ml/p.maxMl,0,1):0;
/* Symbols such as € or $ go first, letter codes such as kr or Kč after the number. */
function money(v,dec){const c=cur(),n=dec?(+v).toFixed(2):fmt(v);return !c?n:/^[^\sA-Za-z\u00C0-\u024F\u0400-\u04FF]{1,2}$/.test(c)?c+n:n+'\u00a0'+c}
const fmtMl=v=>v>=1000?(v/1000).toLocaleString(undefined,{maximumFractionDigits:2})+' l':v<10?mlf(v)+' ml':fmt(v)+' ml';
/* ml a day over the last 90 days (or since the bottle arrived), and days left at that pace. */
function pace(p){const now=Date.now(),span=Math.max(7,Math.min(90,(now-(p.created||now))/DAY)),t0=now-span*DAY;let ml=0;
 S.wears.forEach(w=>{if(w.pid===p.id&&w.t>=t0)ml+=w.n/rateOf(p)});const d=ml/span;return {perDay:d,days:d>0?p.ml/d:null}}
function leftText(days){if(days==null)return '';if(days<14)return 'about '+Math.max(1,Math.round(days))+(Math.round(days)===1?' day left':' days left');
 if(days<70)return 'about '+Math.round(days/7)+' weeks left';if(days<730)return 'about '+Math.round(days/30)+' months left';return 'years left at your pace'}
const lowOf=p=>p.shelf!=='wish'&&+p.maxMl>0&&p.ml>0&&p.ml/p.maxMl<.1;
const idleDays=p=>{const lw=lastWorn(p.id);return Math.floor((Date.now()-(lw||p.created||Date.now()))/DAY)};

/* ================= tests count as wears ================= */
/* Every Test lab test counts as a wear (Journal, calendar, streak, Stats, recaps, picks, share),
   also tests of wishlist bottles and tests typed by hand, old ones included. A test logged from a
   cabinet bottle already made a real wear at the same moment, so it is not counted twice.
   Test entries are read-only here; they are edited in the Test lab. */
function testWears(){const T=(S.tt&&S.tt.sessions)||[];if(!T.length)return [];const real=new Set(S.wears.map(w=>w.pid+'@'+w.t));
 return T.filter(x=>!real.has(x.pid+'@'+x.t0)).map(x=>{const p=x.pid&&byId(x.pid);
  return {id:'t'+x.id,pid:p?p.id:null,t:x.t0,n:+x.sprays||0,test:true,name:p?p.name:x.name,brand:p?p.brand:(x.brand||''),fam:p?p.fam:(x.fam||''),price:x.price}})}
function allWears(){return S.wears.concat(testWears())}
/* The bottle behind a wear, or a stand-in for a tested fragrance that is on no shelf. */
function wP(w){return byId(w.pid)||{id:w.id,name:w.name||'?',brand:w.brand||'',fam:w.fam||'',maxMl:100,ml:100,shelf:'wish'}}
function wKey(w){return w.pid||'n:'+norm((w.brand||'')+' '+w.name)}
function wearMl(w){const p=byId(w.pid);return w.n/(p?rateOf(p):10)}
/* Value of what was sprayed: the price paid for own bottles; for tests also the seen price of a
   wishlist bottle or the price noted in the test (per ml of the bottle size, 100 ml if unknown).
   None of this touches the collection value. */
function wearPerMl(w){const p=byId(w.pid);if(p&&p.shelf!=='wish'&&hasPrice(p))return perMl(p);if(!w.test)return 0;
 const price=+w.price>0?+w.price:p&&+p.seen>0?+p.seen:p&&hasPrice(p)?+p.price:0;return price?price/((p&&+p.maxMl)||100):0}

/* ================= collection notes: almost empty, monthly recap, year in review ================= */
function lowNote(){const low=owned().filter(lowOf);
 S.settings.lowSeen=(S.settings.lowSeen||[]).filter(id=>low.some(p=>p.id===id)); /* a refilled bottle can warn again */
 const show=low.filter(p=>!S.settings.lowSeen.includes(p.id));if(!show.length)return '';
 return `<div class="note low"><span>Almost empty: ${show.map(p=>{const t=leftText(pace(p).days);return `<button class="lnk" data-act="open" data-id="${p.id}">${esc(p.name)}</button> (${mlf(p.ml)} ml${t?', '+t:''})`}).join(', ')}</span><button class="btn ghost sm" data-act="lowHide">Got it</button></div>`}
function recapCard(){const d=new Date();
 const y=d.getMonth()===11?d.getFullYear():d.getMonth()===0&&d.getDate()<=15?d.getFullYear()-1:null;
 if(y&&S.settings.yearSeen!==y){const a=new Date(y,0,1).getTime(),b=new Date(y+1,0,1).getTime(),W=allWears().filter(w=>w.t>=a&&w.t<b&&(w.test||byId(w.pid)));
  if(W.length>=5)return recapHtml('year',y,W,`Your ${y} in fragrance`)}
 if(d.getDate()<=7){const a=new Date(d.getFullYear(),d.getMonth()-1,1),key=a.getFullYear()+'-'+(a.getMonth()+1),b=new Date(d.getFullYear(),d.getMonth(),1).getTime();
  if(S.settings.recapSeen!==key){const W=allWears().filter(w=>w.t>=a.getTime()&&w.t<b&&(w.test||byId(w.pid)));if(W.length)return recapHtml('month',key,W,`Your ${MON[a.getMonth()]} in fragrance`)}}
 return ''}
function recapHtml(kind,key,W,title){const c={},nm={};let ml=0,val=0;
 W.forEach(w=>{const k=wKey(w);c[k]=(c[k]||0)+1;nm[k]=wP(w).name;const m=wearMl(w);ml+=m;val+=m*wearPerMl(w)});
 const top=Object.entries(c).sort((x,y)=>y[1]-x[1])[0],tp={name:nm[top[0]]};

 <div class="rstats"><div><b>${fmt(W.length)}</b><span>wears</span></div><div><b>${fmt(Object.keys(c).length)}</b><span>fragrances</span></div><div><b>${fmtMl(ml)}</b><span>used</span></div>${val?`<div><b>${money(val)}</b><span>sprayed</span></div>`:''}</div>
 <p class="sub2" style="font-size:14px">Most worn: <b style="color:var(--tx)">${esc(tp.name)}</b> \u00b7 ${top[1]} ${top[1]===1?'wear':'wears'}</p>

function valueHtml(){const own=owned(),priced=own.filter(hasPrice),miss=own.length-priced.length;
 const paid=priced.reduce((a,p)=>a+ +p.price,0),left=priced.reduce((a,p)=>a+valueLeft(p),0),ml=own.reduce((a,p)=>a+p.ml,0),pct=paid?Math.round(left/paid*100):0;

/* ================= daily pick: season, weather, occasion and rest ================= */
const OCC=[['day','Everyday'],['work','Work'],['eve','Evening']];
const famKind=f=>{const s=norm(f);if(/amber|gourmand|oud|leather|tobacco|spic|orient/.test(s))return 'warm';if(/fresh|citr|aqua|marine|green|aromat|fougere/.test(s))return 'fresh';return 'mid'};

function rankPicks(day,wx,occ){const AW=allWears(),ss=season(day),d0=sod(day),yk=dkey(d0-DAY),dk=dkey(d0);

 return owned().filter(p=>p.ml>0).map(p=>{const R=[];let sc=0;const add=(v,why)=>{sc+=v;if(why&&v>0)R.push([v,why])};
  const k=famKind(p.fam),se=p.seasons||[],pr=+p.proj||0;
  if(se.includes(ss))add(2,'Made for '+ss.toLowerCase());else if(se.length)add(-1);
  if(tb==='cold')add(k==='warm'?2:k==='fresh'?-1:.4,k==='warm'?t+'° today, a warm and dense scent fits':'');
  else if(tb==='hot')add(k==='fresh'?2:k==='warm'?-1.5:.3,k==='fresh'?t+'° today, something fresh and light':'');
  else if(tb==='mild')add(k==='mid'?.8:.3,k==='mid'?t+'° today, easy weather for it':'');
  if(occ==='work')add(pr>=4?-1.5:k==='warm'?0:.8,pr&&pr<=3?'Polite enough for work':'');
  else if(occ==='eve')add((pr>=4?1.5:0)+(k==='warm'?1:0),pr>=4||k==='warm'?'Has presence for the evening':'');
  let lw=0;AW.forEach(w=>{if(w.pid===p.id&&w.t<d0&&w.t>lw)lw=w.t});
  const d=lw?Math.round((d0-sod(lw))/DAY):null;
  if(d==null)add(2.2,'Not worn yet');else{add(Math.min(d,30)/10+(d>=60?1.5:0),d>=60?'Waiting on the shelf for '+Math.round(d/30)+' months':d>=7?'Not worn for '+d+' days':'');if(dkey(lw)===yk)add(-2)}
  if(AW.some(w=>w.pid===p.id&&w.t>=d0&&w.t<d0+DAY))add(-3);
  add((p.rating||0)*.35,p.rating>=4?'You gave it '+p.rating+' stars':'');
  sc+=(hash(dk+p.id)%100)/250;
  return {p,sc,d:d==null?60:d,why:R.sort((a,b)=>b[0]-a[0]).slice(0,3).map(x=>x[1])}}).sort((a,b)=>b.sc-a.sc)}

<script>
/* Manual update check. Android app: the native side asks GitHub Releases and shows the result itself.
   Web/PWA: compare the files the service worker cached with the ones on the server. */
async function checkForUpdate(){
 if(window.LuxAndroid&&LuxAndroid.checkForUpdate){LuxAndroid.checkForUpdate();return}
 toast('Checking for updates\u2026');
 try{let changed=false;
  for(const f of ['index.html','lux-test.js']){
   // Unique URL + no-store so neither the service worker nor the HTTP cache answers.
   const res=await fetch(f+'?check='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error(res.status);
   const copy=res.clone(),fresh=await res.text(),cached=window.caches?await caches.match('./'+f):null;
   if(cached&&(await cached.text())!==fresh){changed=true;
    // lux-test.js is served cache-first, so store the new copy before reloading.
    for(const k of await caches.keys())await (await caches.open(k)).put('./'+f,copy.clone())}}
  const reg=navigator.serviceWorker?await navigator.serviceWorker.getRegistration():null;if(reg)reg.update().catch(()=>{});
  if(changed){toast('New version found. Updating\u2026');setTimeout(()=>location.reload(),900)}else toast('You have the latest version')
 }catch(e){toast('Could not check. Are you online?')}}
/* Offline support when installed from the web; the Android app bundles its files instead. */
if('serviceWorker' in navigator&&location.protocol!=='file:'&&!window.LuxAndroid){
 window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
